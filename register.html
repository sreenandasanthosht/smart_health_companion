<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Smart Health Companion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link href="shc.css" rel="stylesheet">
<style>
.reg-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 16px}
.role-card{border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;background:#fff;transition:.15s;height:100%}
.role-card:hover{border-color:var(--navy);transform:translateY(-2px)}
.role-card.sel{border-color:var(--navy);background:#e6eefb;box-shadow:0 3px 10px rgba(16,40,80,.12)}
.role-card i{font-size:1.5rem;color:var(--navy)}
.role-card .rn{font-weight:600;font-size:.82rem;margin-top:6px}
</style>
</head><body>
<div class="reg-wrap">
  <div class="authcard" style="width:100%;max-width:620px">
    <div class="brand mb-3" style="padding:0;color:var(--navy);justify-content:center"><span class="logo"><i class="bi bi-heart-pulse-fill"></i></span> Smart Health Companion</div>
    <div class="card2"><div class="bd" style="padding:28px">
      <h2 style="font-size:1.5rem;font-weight:700;margin:0 0 4px;text-align:center">Create your account</h2>
      <p class="subtle text-center mb-4">Choose your role to get started.</p>

      <label class="form-lbl">I am a…</label>
      <div class="row g-2 mb-3">
        <div class="col"><div class="role-card sel"><i class="bi bi-person"></i><div class="rn">Patient</div></div></div>
        <div class="col"><div class="role-card"><i class="bi bi-person-heart"></i><div class="rn">Caregiver</div></div></div>
        <div class="col"><div class="role-card"><i class="bi bi-hospital"></i><div class="rn">Healthcare Provider</div></div></div>
        <div class="col"><div class="role-card"><i class="bi bi-bicycle"></i><div class="rn">Wellness Provider</div></div></div>
        <div class="col"><div class="role-card"><i class="bi bi-capsule-pill"></i><div class="rn">Pharmacy</div></div></div>
      </div>

      <div class="banner info mb-4" style="font-size:.85rem"><i class="bi bi-patch-check"></i>
        <div>Providers are verified before activation — your account starts as <strong>'Pending verification'</strong>.</div></div>

      <label class="form-lbl">Full name</label>
      <input class="inp mb-3" placeholder="e.g. Latha Ramachandran">
      <label class="form-lbl">Email address</label>
      <input class="inp mb-3" type="email" placeholder="you@example.com">
      <label class="form-lbl">Password</label>
      <input class="inp mb-4" type="password" placeholder="Create a password">

      <button class="btn-navy w-100 mb-3">Create account</button>
      <p class="text-center subtle mb-0" style="font-size:.9rem">Already have an account? <a href="login.html" style="color:var(--navy);font-weight:600">Sign in</a></p>
    </div></div>
  </div>
</div>
<script>
document.querySelectorAll('.role-card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.role-card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel')});
</script>
</body></html>
