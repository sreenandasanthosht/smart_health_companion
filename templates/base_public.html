<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CareNest{% endblock %}</title>
    <meta name="description" content="{% block description %}CareNest — where care continues. Track your health, manage medicines, and stay connected to your care team between appointments.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
    <link href="{% static 'css/carenest.css' %}" rel="stylesheet">
</head>
<body class="pub">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-heart-pulse" viewBox="0 0 24 24"><path d="M12 20s-6.5-4.3-9-8.5C1.3 8.3 3 4.5 6.7 4.5c2 0 3.4 1.2 5.3 3.3 1.9-2.1 3.3-3.3 5.3-3.3 3.7 0 5.4 3.8 3.7 7C18.5 15.7 12 20 12 20z"/><path d="M3.2 11.5H7l1.4-2.4 2.3 4.6 1.4-2.2h3.4"/></symbol>
  <symbol id="i-pill" viewBox="0 0 24 24"><path d="M4.5 13.5l9-9a4.5 4.5 0 0 1 6.4 6.4l-9 9a4.5 4.5 0 0 1-6.4-6.4z"/><path d="M8.5 8.5l7 7"/></symbol>
  <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h5"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></symbol>
  <symbol id="i-upload-cloud" viewBox="0 0 24 24"><path d="M6 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 18 18"/><path d="M12 13v6M9.5 15.5L12 13l2.5 2.5"/></symbol>
  <symbol id="i-stethoscope" viewBox="0 0 24 24"><path d="M6 3H4v5a4 4 0 0 0 8 0V3h-2"/><path d="M8 16v1a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c1-3.5 3.5-4.8 5.5-4.8s4.5 1.3 5.5 4.8"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6M18.5 20c-.4-2-1.3-3.4-2.5-4.3"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-5 8-5s6.5 1 8 5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M4 20c0-9 7-15 16-15 0 9-6 16-15 16-.7 0-1 0-1-1z"/><path d="M4 20c4-6 8-8 12-9"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-calendar-days" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M8 13h.4M12 13h.4M16 13h.4M8 17h.4M12 17h.4"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 4 14 2.5-7H21"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17v.5"/></symbol>
  <symbol id="i-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5"/><path d="M12 16v.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8v.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
</svg>

<a class="skip-link" href="#main">Skip to main content</a>

{% block body %}{% endblock %}

</body>
</html>
